{% extends "base_splash.html" %}

{% block header %}
<link href="../css/main.css" rel="stylesheet">
{% endblock %}

{% block content %}
    <div id="hero">
        <h1 id="hero-header">It's Ready</h1>
        <h3 id="hero-subheader">Click to save your finished podcast episode</h3>
        <div class="row">
            <div class="col-md-6"></div>
        </div>
        <a id="btn-download" class="splash-btn-cta" download="podomate_episode.flac" href="#"><i class="fas fa-download btn-icon"></i> SAVE EPISODE</a>
        <a id="btn-download-settings" class="splash-btn-cta" download="podomate_episode_recipe.json" href="#"><i class="fas fa-tasks btn-icon"></i> SAVE RECIPE</a>
        <button id="btn-start-again" class="splash-btn-cta"><i class="fas fa-redo btn-icon"></i> START AGAIN</button>
    </div>
{% endblock %}

{% block scripts %}
<script type="text/javascript">
    async function setDownloadPaths() {
        let masteredTrackFilename = await eel.get_mixed_track_filename()();
        let masteredTrackLink = "../media/" + masteredTrackFilename;
        $("#btn-download").attr("href", masteredTrackLink);

        let recipeFilename = await eel.get_recipe_filename()();
        let recipeLink = "../media/" + recipeFilename;
        $("#btn-download-settings").attr("href", recipeLink);
    }

    async function startAgain() {
        await eel.reset()();
        location.href = "/templates/main.html";
    }

    $(document).ready(function() {
        setDownloadPaths();
    });

    $("#btn-start-again").click(function() {
        startAgain();
    });
</script>
{% endblock %}
