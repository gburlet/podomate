<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <title>Poddit</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/fontawesome.min.css" rel="stylesheet">
    <link href="../css/page_template.css" rel="stylesheet">
    <link href="../css/editor.css" rel="stylesheet">
</head>
<body>

<div id="overlay" style="display: none;">
    <div class="spinner-border text-success" role="status">
        <span class="sr-only">Loading...</span>
    </div>
</div>

<div id="hero">
    <h1 id="hero-header">Edit</h1>
    <h4 id="header-info">Add audio snippets</h4>
</div>

<section>
    <div class="container">

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/templates/mixer.html">Mixer</a></li>
                <li class="breadcrumb-item" aria-current="page"><a href="/templates/edit_onair.html">On-air</a></li>
                <li class="breadcrumb-item" aria-current="page"><a href="/templates/edit_backtracks.html">Backtracks</a></li>
                <li class="breadcrumb-item active" aria-current="page">Inserts</li>
            </ol>
        </nav>

        <div id="alert" class="alert alert-danger" role="alert" style="display: none;"></div>

        <h2>Add Audio Snippets</h2>
        <p>Optional. Insert ads or other prerecorded snippets at specific points in your podcast.</p>
        <div class="row">
            <div class="col-lg-12 text-center">
                <div class="new-insert">
                    <button class="btn-delete" style="display: none;">
                        <i class="fas fa-2x fa-minus-circle"></i>
                    </button>
                    <span><i class="far fa-2x fa-file-audio"></i><br/>Add Snippet</span>
                </div>
            </div>
        </div>

        <div class="row" style="margin-bottom: 2em;">
            <div class="col-lg-6">
                <button id="btn-edit" class="btn btn-success btn-lg btn-block">
                    Add Inserts
                </button>
            </div>
            <div class="col-lg-6">
                <button id="btn-skip" class="btn btn-light btn-lg btn-block">
                    Skip <i class="fa fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
</section>



<script type="text/javascript" src="../js/jquery.min.js"></script>
<script type="text/javascript" src="../js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" src="/eel.js"></script>
<script type="text/javascript">
    $(document).ready(function() {
        $("#btn-edit").click(function() {
            location.href = "/templates/process.html";
        });
        $("#btn-skip").click(function() {
            location.href = "/templates/process.html";
        });
    });
</script>
</body>
</html>
