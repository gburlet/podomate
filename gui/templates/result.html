<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <title>Poddit</title>
    <link href="../css/main.css" rel="stylesheet">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/fontawesome.min.css" rel="stylesheet">
</head>
<body>
    <div id="hero">
        <h1 id="hero-header">It's Ready</h1>
        <h3 id="hero-subheader">Click to save your finished podcast episode</h3>
        <div class="row">
            <div class="col-md-6"></div>
        </div>
        <a id="btn-download" download="poddit_episode.flac" href="#" class="btn">SAVE <i class="fas fa-download"></i></a>
    </div>

    <script type="text/javascript" src="../js/jquery.min.js"></script>
    <script type="text/javascript" src="../js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="/eel.js"></script>
    <script type="text/javascript">
        async function setDownloadPath() {
            let masteredTrackFilename = await eel.get_mixed_track_filename()();
            let masteredTrackLink = "../media/" + masteredTrackFilename;
            $("#btn-download").attr("href", masteredTrackLink);
        }

        $(document).ready(function() {
            setDownloadPath();
        });
    </script>
</body>
</html>
