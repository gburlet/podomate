<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <title>Poddit</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/fontawesome.min.css" rel="stylesheet">
    <link href="../css/page_template.css" rel="stylesheet">
    <link href="../css/editor.css" rel="stylesheet">
    <link href="../css/interactive_waveform.css" rel="stylesheet">
</head>
<body>

<div id="overlay" style="display: none;">
    <div class="spinner-border text-success" role="status">
        <span class="sr-only">Loading...</span>
    </div>
</div>

<div id="hero">
    <h1 id="hero-header">Trim</h1>
    <h4 id="header-info">Select on-air segments</h4>
</div>

<section>
    <ul id="progressbar">
        <li id="mixer"><a href="/templates/mixer.html"><i class="fa fa-sliders-h"></i> <strong>Mixer</strong></a></li>
        <li id="trim" class="active"><i class="fa fa-cut"></i> <strong>Trim</strong></li>
        <li id="music"><i class="fa fa-music"></i> <strong>Music</strong></li>
        <li id="snippets"><i class="fa fa-file-audio"></i> <strong>Snippets</strong></li>
        <li id="finish"><i class="fa fa-check"></i> <strong>Finish</strong></li>
    </ul>

    <div class="container">

        <div id="alert" class="alert alert-danger" role="alert" style="display: none;"></div>

        <h2>Where Were You Live?</h2>
        <p>Drag to select where you were live in the recording. Highlighted sections will be in your final podcast audio.</p>

        {% include "interactive_waveform.html" %}

        <div class="row" style="margin-bottom: 2em;">
            <div class="col-lg-12 text-right">
                <button id="btn-edit" class="btn btn-success btn-lg btn-block">
                    Trim
                </button>
            </div>
        </div>
    </div>
</section>



<script type="text/javascript" src="../js/jquery.min.js"></script>
<script type="text/javascript" src="../js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" src="../js/wavesurfer.min.js"></script>
<script type="text/javascript" src="../js/wavesurfer.timeline.min.js"></script>
<script type="text/javascript" src="../js/wavesurfer.regions.min.js"></script>
<script type="text/javascript" src="../js/interactive_waveform.js"></script>
<script type="text/javascript" src="/eel.js"></script>
<script type="text/javascript">
    async function getAudioFilename() {
        let audioFilename = await eel.get_mixed_track_filename()();
        setupInteractiveWaveform(audioFilename);
    }

    async function setLiveRegions(liveTimestamps) {
        $("#overlay").fadeIn();
        await eel.set_live_timestamps(liveTimestamps)();
        $("#overlay").fadeOut();
        location.href = "/templates/edit_backtracks.html";
    }

    function setError(msg) {
        $("#alert").html(msg);
        $("#alert").show();
    }

    $(document).ready(function() {
        $("#progressbar li.active").prevAll("li").addClass("active");
        getAudioFilename();

        $("#btn-edit").click(function() {
            $("#alert").hide();
            var liveTimestamps = [];
            $.each(wavesurfer.regions.list, function(rid, region) {
                liveTimestamps.push([region.start, region.end]);
            });
            if (liveTimestamps.length == 0) {
                setError("<b>Oh Snap!</b> You need to select segments of your audio where you were on air before moving on.");
            } else {
                setLiveRegions(liveTimestamps);
            }
        });
    });
</script>
</body>
</html>
