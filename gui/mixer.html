<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Poddit</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/fontawesome.min.css" rel="stylesheet">
    <link href="css/mixer.css" rel="stylesheet">
    <link href="css/mdb-file-upload.min.css" rel="stylesheet">
</head>
<body>
<div id="hero">
    <h1 id="hero-header">Mixer</h1>
    <h4 id="header-info">Add audio files for each caster</h4>
</div>

<section>
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div id="audio-field">
                    <h3 class="subheading text-muted">
                        Speaker 1
                        <a tabindex="-1" class="badge-pop badge badge-success align-middle" data-trigger="hover" data-container="body" data-toggle="popover" data-placement="bottom" data-content="<b>File Types</b>: .mp3, .wav<br/><b>Bit Depth</b>: 16, 32">
                            <i class="fas fa-info-circle"></i> Supported Audio
                        </a>
                    </h3>
                    <div id="file-upload-wrapper" class="file-upload-wrapper">
                        <input class="file-upload" type="file" id="speaker1-audio" name="speaker1-audio" accept="audio/*" data-height="150" required>
                    </div>
                    <div id="accordion">
                        <div class="card">
                            <div class="card-header" id="headingOne">
                                <h5 class="mb-0">
                                    <button class="btn" data-toggle="collapse" data-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                                        Options <i class="fas fa-chevron-right align-middle"></i>
                                    </button>
                                </h5>
                            </div>
                            <div id="collapseOne" class="collapse" aria-labelledby="headingOne" data-parent="#accordion">
                                <div class="card-body">
                                    <div class="form-row">
                                        <div class="col">
                                            <div class="switch-container">
                                                <label class="switch">
                                                  <input type="checkbox" id="speaker1-noisegate" checked>
                                                  <span class="slider round"></span>
                                                </label>
                                                Noise Gate
                                            </div>
                                        </div>
                                        <div class="col">
                                            <div class="switch-container">
                                                <label class="switch">
                                                  <input type="checkbox" id="speaker1-noisereduction" checked>
                                                  <span class="slider round"></span>
                                                </label>
                                                Noise Reduction
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="js/jquery.min.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/mdb.min.js"></script>
<script src="js/datatables.min.js"></script>
<script src="js/mdb-file-upload.min.js"></script>
<script type="text/javascript">
    $('[data-toggle="popover"]').popover({"html": true});
    $('.file-upload').file_upload();

    $(document).ready(function(){
        $("#speaker1-audio").change(function(){
            console.log($("#speaker1-audio")[0].files[0]);
            alert($("#speaker1-audio")[0].files[0].name);
        });
    });
</script>

</body>
</html>
